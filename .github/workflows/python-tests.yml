name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install package with all optional dependencies
        run: uv pip install -e ".[llm,dev]" --system

      - name: Run tests
        run: pytest tests/ -v
