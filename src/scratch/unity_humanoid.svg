<g class="leg" transform="translate(40,1030)"><line class="rule" x1="0" y1="-24" x2="820" y2="-24"/>

  <circle class="j root" cx="8" cy="0" r="8"/><text x="24" y="4">Hips — root, HumanBodyBones 0</text>
  <circle class="j" cx="8" cy="28" r="8"/><text x="24" y="32">Required bone (15 total) — avatar will not build without it</text>
  <circle class="j opt" cx="428" cy="0" r="8"/><text x="444" y="4">Optional bone — Mecanim retargets around its absence</text>
  <circle class="j grp" cx="428" cy="28" r="8"/><text x="444" y="32">Finger group: Thumb/Index/Middle/Ring/Little × Proximal/Intermediate/Distal</text></g>
</svg>