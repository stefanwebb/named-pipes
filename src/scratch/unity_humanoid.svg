<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" width="900" height="1150" role="img" aria-label="Unity Humanoid (Mecanim) joint hierarchy">
<style>
.bones line{stroke:var(--bone,#8a93a3);stroke-width:3;stroke-linecap:round}
.j{fill:var(--joint,#3b4252);stroke:var(--bg,#fff);stroke-width:2}
.j.leaf,.j.opt{fill:var(--bg,#fff);stroke:var(--joint,#3b4252);stroke-width:2.5}
.j.root{fill:var(--accent,#2f6fdb);stroke:var(--bg,#fff)}
.j.hip{fill:var(--amber,#d98c1f);stroke:var(--bg,#fff)}
.j.foot{fill:var(--green,#2e9a5d);stroke:var(--bg,#fff)}
.j.grp{fill:var(--bg,#fff);stroke:var(--joint,#3b4252);stroke-width:2.5;stroke-dasharray:3 3}
.lbl{font:500 15px "JetBrains Mono","SF Mono",Menlo,Consolas,monospace;fill:var(--ink,#1c2230)}
.idx{fill:var(--muted,#6b7383);font-weight:400}
.title{font:600 20px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink,#1c2230)}
.sub{font:400 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--muted,#6b7383)}
.leg text{font:400 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink,#1c2230)}
.leg line.rule{stroke:var(--rule,#e2e4e0);stroke-width:1}
</style>
<rect width="900" height="1150" fill="var(--bg,#fff)"/>
<g transform="translate(40,44)"><text class="title" x="0" y="0">Unity Humanoid (Mecanim)</text>
<text class="sub" x="0" y="22">HumanBodyBones enum · 55 bones incl. 30 finger bones · UpperChest was appended last (index 54) · figure faces the viewer</text></g>
