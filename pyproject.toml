[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "named-pipes"
version = "0.1.2"
description = "Low-latency interprocess communication via named pipes for Python agent/service workflows"
readme = "README.md"
license = {text = "CC-BY-SA-4.0"}
requires-python = ">=3.11"
authors = [{name = "Stefan Webb", email = "info@stefanwebb.me"}]
keywords = ["ipc", "named-pipes", "fifo", "agents", "llm", "tts", "stt", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["psutil", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/stefanwebb/named-pipes"
Repository = "https://github.com/stefanwebb/named-pipes"
Changelog = "https://github.com/stefanwebb/named-pipes/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/stefanwebb/named-pipes/issues"

[project.optional-dependencies]
llm = [
    "vllm; sys_platform == 'linux'",
    "mlx-lm; sys_platform == 'darwin'",
    "transformers>=5.5.0",
    "torch",
]
tts = [
    "vllm-omni; sys_platform == 'linux'",
    "mlx-audio; sys_platform == 'darwin'",
    "soundfile",
    "sounddevice",
]
stt = ["sounddevice"]
kokoro = ["misaki[en]"]
dev = ["pytest", "ruff"]

[project.scripts]
cpipe = "named_pipes.cpipe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
unfixable = ["F401"]
