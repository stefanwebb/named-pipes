[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "named-pipes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psutil"]

[project.optional-dependencies]
llm = [
    "vllm; sys_platform == 'linux'",
    "mlx-lm; sys_platform == 'darwin'",
    "transformers>=5.5.0",
    "torch",
]
tts = [
    "vllm-omni; sys_platform == 'linux'",
    "mlx-audio; sys_platform == 'darwin'",
    "soundfile",
    "sounddevice",
]
kokoro = ["misaki[en]"]
dev = ["pytest", "ruff"]

[project.scripts]
cpipe = "named_pipes.cpipe:main"

[tool.setuptools.packages.find]
where = ["src"]
